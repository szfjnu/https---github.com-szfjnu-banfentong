<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深色背景 -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    
    <!-- 霓虹渐变 -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#667eea"/>
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.8"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 深色背景 -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#darkBg)"/>
  
  <!-- 外围发光圆环 -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#neonGrad)" stroke-width="1" opacity="0.3" filter="url(#neonGlow)"/>
  <circle cx="256" cy="240" r="150" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- 核心图标：电路板风格的班级管理 -->
  <g transform="translate(256, 240)" filter="url(#neonGlow)">
    <!-- 中心芯片 -->
    <rect x="-40" y="-50" width="80" height="100" rx="8" fill="none" stroke="url(#neonGrad)" stroke-width="3"/>
    
    <!-- 芯片内部B字母 -->
    <path d="M -20 -30 L -20 30 L 5 30 C 20 30 28 22 28 10 C 28 2 22 -4 14 -6 C 20 -8 26 -16 26 -26 C 26 -40 12 -48 -5 -48 L -20 -48 L -20 -30 Z" 
          fill="url(#neonGrad)"/>
    <path d="M -20 -6 L 8 -6 L 8 6 L -20 6 Z" fill="#0f0f23"/>
    <path d="M -20 -36 L -5 -36 L -5 -24 L -20 -24 Z" fill="#0f0f23"/>
    
    <!-- 芯片引脚 -->
    <line x1="-50" y1="-30" x2="-40" y2="-30" stroke="#00d4ff" stroke-width="2"/>
    <line x1="-50" y1="-10" x2="-40" y2="-10" stroke="#00d4ff" stroke-width="2"/>
    <line x1="-50" y1="10" x2="-40" y2="10" stroke="#00d4ff" stroke-width="2"/>
    <line x1="-50" y1="30" x2="-40" y2="30" stroke="#00d4ff" stroke-width="2"/>
    
    <line x1="40" y1="-30" x2="50" y2="-30" stroke="#00d4ff" stroke-width="2"/>
    <line x1="40" y1="-10" x2="50" y2="-10" stroke="#00d4ff" stroke-width="2"/>
    <line x1="40" y1="10" x2="50" y2="10" stroke="#00d4ff" stroke-width="2"/>
    <line x1="40" y1="30" x2="50" y2="30" stroke="#00d4ff" stroke-width="2"/>
    
    <line x1="-20" y1="-60" x2="-20" y2="-50" stroke="#00d4ff" stroke-width="2"/>
    <line x1="0" y1="-60" x2="0" y2="-50" stroke="#00d4ff" stroke-width="2"/>
    <line x1="20" y1="-60" x2="20" y2="-50" stroke="#00d4ff" stroke-width="2"/>
    
    <line x1="-20" y1="50" x2="-20" y2="60" stroke="#00d4ff" stroke-width="2"/>
    <line x1="0" y1="50" x2="0" y2="60" stroke="#00d4ff" stroke-width="2"/>
    <line x1="20" y1="50" x2="20" y2="60" stroke="#00d4ff" stroke-width="2"/>
    
    <!-- 连接线 -->
    <line x1="-70" y1="-30" x2="-90" y2="-50" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-70" y1="30" x2="-90" y2="50" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="-30" x2="90" y2="-50" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="70" y1="30" x2="90" y2="50" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 节点圆点 -->
    <circle cx="-90" cy="-50" r="4" fill="#00d4ff"/>
    <circle cx="-90" cy="50" r="4" fill="#00d4ff"/>
    <circle cx="90" cy="-50" r="4" fill="#00d4ff"/>
    <circle cx="90" cy="50" r="4" fill="#00d4ff"/>
  </g>
  
  <!-- 底部文字 -->
  <text x="256" y="400" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="44" 
        font-weight="bold"
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="10">班分通</text>
  
  <text x="256" y="435" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="16" 
        fill="#00d4ff" 
        text-anchor="middle"
        letter-spacing="4"
        opacity="0.8">AI智能班级管理平台</text>
</svg>