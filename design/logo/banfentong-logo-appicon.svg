<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 应用图标渐变 -->
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    
    <linearGradient id="accentApp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#667eea"/>
    </linearGradient>
    
    <!-- 阴影 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#667eea" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#appGrad)"/>
  
  <!-- 高光效果 -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#appGrad)" opacity="0.9"/>
  <ellipse cx="128" cy="60" rx="80" ry="40" fill="#ffffff" opacity="0.1"/>
  
  <!-- 中心B字母 - 简洁有力 -->
  <g transform="translate(128, 128)" filter="url(#dropShadow)">
    <!-- B字母主体 -->
    <path d="M -35 -50 L -35 50 L 15 50 C 40 50 55 38 55 18 C 55 5 45 -5 30 -8 C 42 -12 52 -25 52 -42 C 52 -62 32 -75 5 -75 L -35 -75 L -35 -50 Z" 
          fill="#ffffff"/>
    
    <!-- B字母镂空 -->
    <path d="M -35 -5 L 15 -5 L 15 15 L -35 15 Z" fill="url(#appGrad)"/>
    <path d="M -35 -55 L 0 -55 L 0 -35 L -35 -35 Z" fill="url(#appGrad)"/>
    
    <!-- 右上角装饰点 - 象征数据 -->
    <circle cx="45" cy="-55" r="6" fill="#00d4ff"/>
    <circle cx="55" cy="-40" r="4" fill="#00d4ff" opacity="0.6"/>
  </g>
  
  <!-- 底部小字 -->
  <text x="128" y="210" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="14" 
        font-weight="bold"
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.9">BFT</text>
</svg>