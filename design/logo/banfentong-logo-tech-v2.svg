    <path d="M8,-5 Q4,-5 2,-2 Q1,0 4,1 Q6,2 8,2 Q10,3 11,4 Q12,5 12,6 Q12,8 10,9 Q8,11 4,11 L4,7 Q7,7 8,6 Q8,6 8,5 Q8,5 7,4 Q6,4 4,3 Q2,2 0,1 Q-2,-1 -2,-3 Q-2,-5 0,-7 Q2,-9 8,-9 Z" transform="scale(0.7)"/>
