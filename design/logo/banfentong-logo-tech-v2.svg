    <path d="M94,-5 L94,11 L98,11 L98,-5 Z" transform="scale(0.7)"/>
    <!-- N -->
    <path d="M102,-5 L102,11 L106,11 L106,-1 L112,11 L116,11 L116,-5 L112,-5 L112,7 L106,-5 Z" transform="scale(0.7)"/>
    <!-- K -->
    <path d="M120,-5 L120,11 L124,11 L124,2 L128,11 L132,11 L128,0 L132,-5 L128,-5 L124,0 L124,-5 Z" transform="scale(0.7)"/>
  </g>

  <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <path d="M 472 80 L 472 40 L 432 40" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <path d="M 40 432 L 40 472 L 80 472" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <path d="M 472 432 L 472 472 L 432 472" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
</svg>